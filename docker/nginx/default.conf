upstream django {
    server web:8000;
}

map $upstream_http_cache_control $html_cache_control {
    ""      "no-cache";
    default $upstream_http_cache_control;
}

map $uri $static_cache_control {
    "~\.[0-9a-f]{12}\.[a-z0-9]+$"  "public, max-age=31536000, immutable";
    default                        "public, max-age=3600";
}

server {
    listen 80;
    server_name ~^www\.(?<main_host>.+)$;
    return 301 $scheme://$main_host$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml application/xml application/javascript
               application/json application/ld+json image/svg+xml
               application/manifest+json;

    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        add_header Cache-Control $static_cache_control;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_hide_header Cache-Control;
        add_header Cache-Control $html_cache_control;
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
        add_header Retry-After 120 always;
    }
}